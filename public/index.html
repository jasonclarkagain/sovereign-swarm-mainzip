<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .subtitle {
      font-size: 12px;
      color: #666;
    }

    #reset-btn {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    #reset-btn:hover {
      border-color: #555;
      color: #ccc;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .message {
      display: flex;
      gap: 12px;
      max-width: 780px;
      width: 100%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .message.user .avatar {
      background: #1e293b;
      color: #94a3b8;
    }

    .message.assistant .avatar {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 600px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #1a1a1a;
      color: #e5e5e5;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #444;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      color: #ccc;
    }

    .empty-state p {
      font-size: 14px;
      text-align: center;
      max-width: 320px;
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #222;
      background: #111;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 780px;
      margin: 0 auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color 0.15s;
    }

    .input-wrapper:focus-within {
      border-color: #6366f1;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e5e5e5;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 150px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: #555; }

    #send-btn {
      background: #6366f1;
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #5558e0; }
    #send-btn:disabled { background: #2a2a2a; cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">✦</div>
      <div>
        <h1>AI Assistant</h1>
        <div class="subtitle">Powered by OpenAI</div>
      </div>
    </div>
    <button id="reset-btn">New chat</button>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">✦</div>
      <h2>How can I help you?</h2>
      <p>Ask me anything — I'm here to assist you.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="user-input"
        placeholder="Type a message..."
        rows="1"
      ></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");
    const emptyState = document.getElementById("empty-state");
    const sessionId = Math.random().toString(36).slice(2);

    let isStreaming = false;

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, content) {
      if (emptyState.parentNode) emptyState.remove();

      const div = document.createElement("div");
      div.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;

      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return bubble;
    }

    function addTypingIndicator() {
      if (emptyState.parentNode) emptyState.remove();

      const div = document.createElement("div");
      div.className = "message assistant";
      div.id = "typing";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message || isStreaming) return;

      isStreaming = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      inputEl.style.height = "auto";

      addMessage("user", message);
      const typing = addTypingIndicator();

      let bubble = null;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            try {
              const data = JSON.parse(line.slice(6));
              if (data.content) {
                if (!bubble) {
                  typing.remove();
                  const msg = addMessage("assistant", "");
                  bubble = messagesEl.lastChild.querySelector(".bubble");
                  bubble.textContent = "";
                }
                bubble.textContent += data.content;
                scrollToBottom();
              }
            } catch {}
          }
        }
      } catch (err) {
        typing.remove();
        addMessage("assistant", "Sorry, something went wrong. Please try again.");
      }

      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", sendMessage);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
    });

    resetBtn.addEventListener("click", async () => {
      await fetch("/api/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      messagesEl.innerHTML = "";
      messagesEl.appendChild(emptyState);
      document.body.querySelector(".empty-state") || messagesEl.appendChild(emptyState);
    });
  </script>
</body>
</html>
